# Ambiente de desenvolvimento (Docker Desktop).
# Uso: docker compose -f compose.dev.yaml up --build
# O código local é montado no container e o servidor recarrega a cada alteração.
# O banco fica em um volume próprio, separado do volume de produção de compose.yaml.
name: controle-abastecimento-dev

services:
  app:
    build: .
    entrypoint: []
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: dev-only-insecure-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:${APP_PORT:-8000}"
      APP_TIME_ZONE: "${APP_TIME_ZONE:-America/Cuiaba}"
      SQLITE_PATH: /app/data/db.sqlite3
      BACKUP_DIR: /app/data/backups
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app
      - fuel_dev_data:/app/data
    develop:
      watch:
        - action: rebuild
          path: requirements.txt

volumes:
  fuel_dev_data:
